name: CI & Auto Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Build & Verify Production Bundle
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: ⚡ Generate Prisma Client
        run: npx prisma generate

      - name: 🔍 Type Checking (TSC)
        run: npx tsc --noEmit

      - name: 🏗️ Build Production Bundle
        run: npm run build
        env:
          NEXT_PUBLIC_APP_NAME: "RAHUL JEE TRADING COMPANY"

      - name: 🚀 Trigger Hostinger Auto-Deploy (Webhook)
        if: env.HOSTINGER_DEPLOY_WEBHOOK != ''
        env:
          HOSTINGER_DEPLOY_WEBHOOK: ${{ secrets.HOSTINGER_DEPLOY_WEBHOOK }}
        run: |
          echo "Triggering Hostinger automated deployment webhook..."
          curl -s -X POST "$HOSTINGER_DEPLOY_WEBHOOK" || true
          echo "Deployment triggered successfully!"
